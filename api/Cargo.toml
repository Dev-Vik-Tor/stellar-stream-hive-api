[package]
name = "stellar-stream-hive-api"
version = "0.1.0"
edition = "2021"
description = "REST API that indexes Stellar payment-stream contract activity for Stellar Stream Hive."
license = "Apache-2.0"
repository = "https://github.com/Stellar-Hive/stellar-stream-hive-api"
publish = false

[dependencies]
# Web framework / async runtime
axum = { version = "0.7", features = ["json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }

# HTTP client for polling Horizon. Uses the platform-native TLS backend
# (SChannel on Windows via the `native-tls` crate) rather than rustls, since
# rustls's `ring` dependency needs a working C toolchain to build and this
# project targets environments where only a GNU Rust toolchain (no C compiler
# with a full libc) is guaranteed to be present.
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Stellar XDR decoding for Soroban contract events, and strkey (G.../C...) handling
stellar-xdr = { version = "26.0.1", default-features = false, features = ["curr", "base64", "std"] }
stellar-strkey = "0.0.18"

# Error handling
thiserror = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Time
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }

[profile.release]
opt-level = 3
lto = true
